<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 500px; }
        h1 { font-size: 2rem; margin-bottom: 24px; color: #e94560; text-align: center; }
        .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
        .add-form input { flex: 1; padding: 12px 16px; border: 2px solid #16213e; border-radius: 8px; background: #16213e; color: #eee; font-size: 1rem; outline: none; }
        .add-form input:focus { border-color: #e94560; }
        .add-form button { padding: 12px 24px; background: #e94560; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .add-form button:hover { background: #c73e54; }
        .todo-list { list-style: none; }
        .todo-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #16213e; border-radius: 8px; margin-bottom: 8px; }
        .todo-item.done .todo-title { text-decoration: line-through; opacity: 0.5; }
        .todo-title { flex: 1; font-size: 1rem; }
        .todo-date { font-size: 0.75rem; color: #888; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .btn-toggle { background: #0f3460; color: #eee; }
        .btn-toggle:hover { background: #1a4a8a; }
        .btn-delete { background: #533; color: #e94560; }
        .btn-delete:hover { background: #744; }
        .empty { text-align: center; color: #666; padding: 40px; font-size: 1.1rem; }
        .count { text-align: center; color: #666; font-size: 0.85rem; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Todo List</h1>
        <form class="add-form" action="/add" method="POST">
            <input type="text" name="title" placeholder="What needs to be done?" autofocus required>
            <button type="submit">Add</button>
        </form>
        {% if todos %}
        <ul class="todo-list">
            {% for todo in todos %}
            <li class="todo-item {{ 'done' if todo.done }}">
                <a href="/toggle/{{ todo.id }}" class="btn btn-toggle">{{ '✅' if todo.done else '⬜' }}</a>
                <span class="todo-title">{{ todo.title }}</span>
                <span class="todo-date">{{ todo.created_at[:10] }}</span>
                <a href="/delete/{{ todo.id }}" class="btn btn-delete">🗑️</a>
            </li>
            {% endfor %}
        </ul>
        <p class="count">{{ todos|length }} item{{ 's' if todos|length != 1 }}</p>
        {% else %}
        <p class="empty">No todos yet. Add one above!</p>
        {% endif %}
    </div>
</body>
</html>
